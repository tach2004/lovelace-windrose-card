name: TypeScript and localization tests

on:
  pull_request:
  push:
    branches:
      - translation/de-complete

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest --runInBand
