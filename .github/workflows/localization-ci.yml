name: TypeScript, full tests, and build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: All Jest tests
        run: npm test
      - name: Build the committed Home Assistant JavaScript file
        run: npm run build:repo
      - name: Verify committed JS matches the TypeScript source
        run: |
          test -s windrose-card.js
          git diff --exit-code -- windrose-card.js
