name: Temporary one-time build for bundled JS

# This temporary helper lives only on the PR branch and will be removed
# before the PR is merged. It does not publish releases.
on:
  push:
    branches:
      - fix/bundled-js-in-repo

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run esbuild
      - name: Commit compiled JS to this branch once
        run: |
          test -s build/windrose-card.js
          cp build/windrose-card.js windrose-card.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- windrose-card.js
          if ! git diff --cached --quiet; then
            git commit -m "Add compiled windrose-card.js to repository"
            git push origin HEAD:fix/bundled-js-in-repo
          fi
